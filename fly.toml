# Fly.io: single machine, persistent volume for the SQLite database.
#   fly launch --no-deploy   (creates the app; keep this file)
#   fly volumes create data --size 1
#   fly secrets set GEMINI_API_KEY=...
#   fly deploy
app = "batch-creative"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/batch-creative.db"
  MAX_CONCURRENCY = "3"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
